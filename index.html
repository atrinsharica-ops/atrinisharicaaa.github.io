<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrin's comfort zone</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-pink: #fff2f7;
      --card-bg: #fffafc;
      --accent-pink: #f49ac1;
      --soft-pink: #ffd6e7;
      --text-color: #7d4e63;
      --border-pink: #ffc2dc;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-pink); }
    ::-webkit-scrollbar-thumb { background: var(--border-pink); border-radius: 10px; }

    body {
      margin: 0;
      padding: 28px;
      font-family: 'Fredoka', sans-serif;
      color: var(--text-color);
      background-color: var(--bg-pink);
      background-image: radial-gradient(#ffd6e7 1.5px, transparent 1.5px), radial-gradient(#ffd6e7 1.5px, #fff2f7 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Corner Glitter & Sparkles (Stays around outer edges) */
    .sparkle-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sp {
      position: absolute;
      color: #f49ac1;
      opacity: 0.55;
      animation: twinkleFloat 7s ease-in-out infinite;
    }

    @keyframes twinkleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(0.9); opacity: 0.35; }
      50% { transform: translateY(-16px) rotate(25deg) scale(1.2); opacity: 0.85; }
    }

    /* Floating Cuties (Click to follow cursor!) */
    .floater {
      position: fixed;
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #ffc2dc;
      box-shadow: 0 4px 10px rgba(244, 154, 193, 0.35);
      cursor: pointer;
      z-index: 999;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .floater:hover { transform: scale(1.15); }
    .floater.following { pointer-events: auto; z-index: 1001; box-shadow: 0 6px 16px rgba(244, 154, 193, 0.65); }

    .f1 { animation: floatOne 15s ease-in-out infinite; }
    .f2 { animation: floatTwo 18s ease-in-out infinite; }
    .f3 { animation: floatThree 13s ease-in-out infinite; }

    @keyframes floatOne {
      0%   { top: 10%; left: 6%; transform: rotate(-6deg); }
      33%  { top: 28%; left: 88%; transform: rotate(8deg); }
      66%  { top: 76%; left: 82%; transform: rotate(-5deg); }
      100% { top: 10%; left: 6%; transform: rotate(-6deg); }
    }

    @keyframes floatTwo {
      0%   { top: 75%; left: 8%; transform: rotate(6deg); }
      33%  { top: 16%; left: 84%; transform: rotate(-8deg); }
      66%  { top: 68%; left: 15%; transform: rotate(5deg); }
      100% { top: 75%; left: 8%; transform: rotate(6deg); }
    }

    @keyframes floatThree {
      0%   { top: 45%; left: 90%; transform: rotate(0deg) scale(1); }
      50%  { top: 14%; left: 12%; transform: rotate(12deg) scale(1.08); }
      100% { top: 45%; left: 90%; transform: rotate(0deg) scale(1); }
    }

    .window {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 2.5px solid var(--border-pink);
      border-radius: 24px;
      box-shadow: 6px 6px 0px var(--soft-pink);
      overflow: hidden;
      height: fit-content;
    }

    .top-bar {
      background: linear-gradient(90deg, #ffc2dc, #ffe0ed);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #8f5670;
      font-family: 'VT323', monospace;
      font-size: 22px;
    }

    .dots span {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 6px;
    }

    .content {
      padding: 30px 34px 34px 34px;
      position: relative;
    }

    /* Creator's Account Corner Badge */
    .creator-corner {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .creator-card-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      background: #ffffff;
      border: 2px dashed var(--border-pink);
      border-radius: 999px;
      padding: 6px 16px 6px 8px;
      color: var(--text-color);
      box-shadow: 3px 3px 0px var(--soft-pink);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .creator-card-link:hover {
      transform: scale(1.06);
      background: #fff0f6;
    }

    .creator-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--accent-pink);
    }

    .creator-info {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .creator-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-pink);
      text-transform: lowercase;
    }

    .creator-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-color);
    }

    /* Slightly Bigger Top Bubble Board for Your GIF */
    .top-gif-bubble {
      width: fit-content;
      max-width: 300px;
      margin: 0 auto 22px auto;
      background: #ffffff;
      border: 2.5px dashed var(--border-pink);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 4px 4px 0px var(--soft-pink);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .top-gif-bubble img {
      max-width: 100%;
      max-height: 185px;
      border-radius: 16px;
      display: block;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      color: var(--accent-pink);
      text-shadow: 2px 2px 0px #ffe6f0;
    }

    .subtitle {
      font-size: 16px;
      margin-top: 6px;
      color: #9c6b81;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin: 24px 0;
    }

    .nav-link {
      text-decoration: none;
      background: #ffffff;
      border: 2px solid var(--border-pink);
      color: var(--accent-pink);
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15.5px;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      box-shadow: 2px 2px 0px var(--soft-pink);
      display: inline-block;
    }

    .nav-link:hover {
      transform: scale(1.13);
      background: var(--soft-pink);
      color: #6e3b52;
    }

    .nav-link.active {
      background: var(--accent-pink);
      color: #ffffff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 20px;
    }

    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
    }

    .box {
      background: #ffffff;
      border: 2px dashed var(--border-pink);
      border-radius: 20px;
      padding: 22px;
    }

    .box h2 {
      margin-top: 0;
      font-size: 19px;
      color: var(--accent-pink);
      border-bottom: 2px dotted var(--soft-pink);
      padding-bottom: 8px;
    }

    .suggest-btn {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: #ffe6f0;
      border: 2px solid var(--border-pink);
      color: #7d4e63;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 600;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .suggest-btn:hover {
      transform: scale(1.08);
      background: var(--accent-pink);
      color: #ffffff;
    }

    ul.fav-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.fav-list li {
      padding: 8px 0;
      font-size: 15px;
      border-bottom: 1px dashed #fff0f6;
    }

    ul.fav-list li:last-child {
      border-bottom: none;
    }

    ul.fav-list li::before {
      content: "♡ ";
      color: var(--accent-pink);
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13.5px;
      color: #b07d93;
    }
  </style>
</head>
