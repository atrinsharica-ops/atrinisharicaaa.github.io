<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>movies — rins comfort zone</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-pink: #fff2f7;
      --card-bg: #fffafc;
      --accent-pink: #f49ac1;
      --soft-pink: #ffd6e7;
      --text-color: #7d4e63;
      --border-pink: #ffc2dc;
    }

    body {
      margin: 0;
      padding: 28px;
      font-family: 'Fredoka', sans-serif;
      color: var(--text-color);
      background-color: var(--bg-pink);
      background-image: radial-gradient(#ffd6e7 1.5px, transparent 1.5px), radial-gradient(#ffd6e7 1.5px, #fff2f7 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .floater {
      position: fixed;
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #ffc2dc;
      box-shadow: 0 4px 10px rgba(244, 154, 193, 0.35);
      cursor: pointer;
      z-index: 999;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .floater:hover { transform: scale(1.15); }
    .floater.following { z-index: 1001; box-shadow: 0 6px 16px rgba(244, 154, 193, 0.65); }

    .f1 { animation: floatOne 15s ease-in-out infinite; }
    .f2 { animation: floatTwo 18s ease-in-out infinite; }
    .f3 { animation: floatThree 13s ease-in-out infinite; }

    @keyframes floatOne {
      0%   { top: 10%; left: 6%; transform: rotate(-6deg); }
      33%  { top: 28%; left: 88%; transform: rotate(8deg); }
      66%  { top: 76%; left: 82%; transform: rotate(-5deg); }
      100% { top: 10%; left: 6%; transform: rotate(-6deg); }
    }

    @keyframes floatTwo {
      0%   { top: 75%; left: 8%; transform: rotate(6deg); }
      33%  { top: 16%; left: 84%; transform: rotate(-8deg); }
      66%  { top: 68%; left: 15%; transform: rotate(5deg); }
      100% { top: 75%; left: 8%; transform: rotate(6deg); }
    }

    @keyframes floatThree {
      0%   { top: 45%; left: 90%; transform: rotate(0deg) scale(1); }
      50%  { top: 14%; left: 12%; transform: rotate(12deg) scale(1.08); }
      100% { top: 45%; left: 90%; transform: rotate(0deg) scale(1); }
    }

    .window {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      border: 2.5px solid var(--border-pink);
      border-radius: 24px;
      box-shadow: 6px 6px 0px var(--soft-pink);
      overflow: hidden;
      height: fit-content;
    }

    .top-bar {
      background: linear-gradient(90deg, #ffc2dc, #ffe0ed);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #8f5670;
      font-family: 'VT323', monospace;
      font-size: 22px;
    }

    .dots span {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 6px;
    }

    .content { padding: 34px; }
    header { text-align: center; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 36px; color: var(--accent-pink); text-shadow: 2px 2px 0px #ffe6f0; }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin: 22px 0 24px 0;
    }

    .nav-link {
      text-decoration: none;
      background: #ffffff;
      border: 2px solid var(--border-pink);
      color: var(--accent-pink);
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      box-shadow: 2px 2px 0px var(--soft-pink);
      display: inline-block;
    }

    .nav-link:hover {
      transform: scale(1.13);
      background: var(--soft-pink);
      color: #6e3b52;
    }

    .nav-link.active {
      background: var(--accent-pink);
      color: #ffffff;
    }

    .search-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 26px;
    }

    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 11px 20px;
      border: 2px solid var(--border-pink);
      border-radius: 999px;
      background: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      color: var(--text-color);
      outline: none;
      box-shadow: 3px 3px 0px var(--soft-pink);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .search-input::placeholder { color: #c996ad; }
    .search-input:focus { transform: scale(1.03); border-color: var(--accent-pink); }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 22px;
    }

    .poster-card {
      background: #ffffff;
      border: 2px dashed var(--border-pink);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .movie-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
      text-align: center;
      line-height: 1.25;
      margin: 0;
    }

    .poster-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 12px;
      border: 1.5px solid var(--soft-pink);
      background-color: #fff2f7;
    }

    .watch-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
      background: #ffd6e7;
      color: #ffffff;
      text-shadow: 0px 1px 2px rgba(180, 100, 135, 0.45);
      border: 2px solid #ffc2dc;
      padding: 9px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14.5px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .watch-btn:hover {
      transform: scale(1.08);
      background: #f49ac1;
    }

    .no-results {
      text-align: center;
      color: #b07d93;
      font-size: 15px;
      display: none;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13.5px;
      color: #b07d93;
    }
  </style>
</head>
<body>

  <img src="https://i.pinimg.com/736x/90/b8/3d/90b83dbf79e6be69f108709810962b23.jpg" class="floater f1" title="click me to follow!">
  <img src="https://i.pinimg.com/736x/2e/44/18/2e4418873ead18414b3030176ddd0283.jpg" class="floater f2" title="click me to follow!">
  <img src="https://i.pinimg.com/originals/37/e6/54/37e6546555565309406876ec766d5b05.gif" class="floater f3" title="click me to follow!">

  <div class="window">
    <div class="top-bar">
      <span>✿ movies</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <div class="content">
      <header>
        <h1>movies</h1>
      </header>

      <nav>
        <a href="index.html" class="nav-link">home</a>
        <a href="movies.html" class="nav-link active">movies</a>
        <a href="shows.html" class="nav-link">tv shows</a>
      </nav>

      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="search a movie... ˚⟡˖ ࣪">
      </div>

      <div class="poster-grid" id="grid"></div>
      <p class="no-results" id="noResults">no movies found matching that name ♡</p>

      <footer>
        made with ♡ and lots of pink pixels • 2026
      </footer>
    </div>
  </div>

  <!-- ========================================================= -->
  <!--        YOUR EASY MOVIE LIST (EDIT ONLY THIS PART!)        -->
  <!-- ========================================================= -->
  <script>
    const myMovies = [
      { title: "Foxfire (1996)", poster: "PASTE_POSTER_LINK_1", link: "PASTE_WATCH_LINK_1" },
      { title: "The Craft (1996)", poster: "PASTE_POSTER_LINK_2", link: "PASTE_WATCH_LINK_2" },
      { title: "Suicide Room (2011)", poster: "PASTE_POSTER_LINK_3", link: "PASTE_WATCH_LINK_3" },
    ];

    // Do not touch anything below this line!
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const noResults = document.getElementById("noResults");

    function renderCards(list) {
      grid.innerHTML = "";
      if (list.length === 0) {
        noResults.style.display = "block";
        return;
      }
      noResults.style.display = "none";
      list.forEach(item => {
        grid.innerHTML += `
          <div class="poster-card">
            <p class="movie-title">${item.title}</p>
            <img src="${item.poster}" alt="${item.title}">
            <a href="${item.link}" target="_blank" class="watch-btn">click to watch</a>
          </div>
        `;
      });
    }

    renderCards(myMovies);

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase();
      const filtered = myMovies.filter(m => m.title.toLowerCase().includes(query));
      renderCards(filtered);
    });

    // Click-to-Follow Cursor Script
    let activeFollower = null;
    document.querySelectorAll('.floater').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        if (activeFollower === img) {
          img.classList.remove('following');
          img.style.animation = '';
          activeFollower = null;
        } else {
          if (activeFollower) {
            activeFollower.classList.remove('following');
            activeFollower.style.animation = '';
          }
          activeFollower = img;
          img.classList.add('following');
          img.style.animation = 'none';
        }
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (activeFollower) {
        activeFollower.style.left = (e.clientX + 12) + 'px';
