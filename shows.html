<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tv shows — rins comfort zone</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-pink: #fff2f7;
      --card-bg: #fffafc;
      --accent-pink: #f49ac1;
      --soft-pink: #ffd6e7;
      --text-color: #7d4e63;
      --border-pink: #ffc2dc;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: 'Fredoka', sans-serif;
      color: var(--text-color);
      background-color: var(--bg-pink);
      background-image: radial-gradient(#ffd6e7 1.5px, transparent 1.5px), radial-gradient(#ffd6e7 1.5px, #fff2f7 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .floating-sparkle {
      position: fixed;
      font-size: 24px;
      color: #f49ac1;
      pointer-events: none;
      z-index: 999;
      animation: floatAround 16s ease-in-out infinite;
    }

    @keyframes floatAround {
      0%   { top: 10%; left: 8%; transform: rotate(0deg) scale(1); }
      25%  { top: 25%; left: 85%; transform: rotate(180deg) scale(1.2); }
      50%  { top: 75%; left: 78%; transform: rotate(360deg) scale(0.95); }
      75%  { top: 65%; left: 12%; transform: rotate(540deg) scale(1.15); }
      100% { top: 10%; left: 8%; transform: rotate(720deg) scale(1); }
    }

    .window {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border: 2.5px solid var(--border-pink);
      border-radius: 22px;
      box-shadow: 5px 5px 0px var(--soft-pink);
      overflow: hidden;
      height: fit-content;
    }

    .top-bar {
      background: linear-gradient(90deg, #ffc2dc, #ffe0ed);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #8f5670;
      font-family: 'VT323', monospace;
      font-size: 20px;
    }

    .dots span {
      display: inline-block;
      width: 11px;
      height: 11px;
      background: #ffffff;
      border-radius: 50%;
      margin-left: 5px;
    }

    .content { padding: 28px; }
    header { text-align: center; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 32px; color: var(--accent-pink); text-shadow: 2px 2px 0px #ffe6f0; }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin: 20px 0 22px 0;
    }

    .nav-link {
      text-decoration: none;
      background: #ffffff;
      border: 2px solid var(--border-pink);
      color: var(--accent-pink);
      padding: 9px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      box-shadow: 2px 2px 0px var(--soft-pink);
      display: inline-block;
    }

    .nav-link:hover {
      transform: scale(1.13);
      background: var(--soft-pink);
      color: #6e3b52;
    }

    .nav-link.active {
      background: var(--accent-pink);
      color: #ffffff;
    }

    /* Cute Search Bar */
    .search-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      max-width: 360px;
      padding: 10px 18px;
      border: 2px solid var(--border-pink);
      border-radius: 999px;
      background: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-size: 14.5px;
      color: var(--text-color);
      outline: none;
      box-shadow: 3px 3px 0px var(--soft-pink);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .search-input::placeholder {
      color: #c996ad;
    }

    .search-input:focus {
      transform: scale(1.03);
      border-color: var(--accent-pink);
    }

    /* Poster Grid */
    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 20px;
    }

    .poster-card {
      background: #ffffff;
      border: 2px dashed var(--border-pink);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .movie-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-color);
      text-align: center;
      line-height: 1.25;
      margin: 0;
    }

    .poster-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 12px;
      border: 1.5px solid var(--soft-pink);
      background-color: #fff2f7;
    }

    .watch-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
      background: #ffd6e7;
      color: #ffffff;
      text-shadow: 0px 1px 2px rgba(180, 100, 135, 0.45);
      border: 2px solid #ffc2dc;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .watch-btn:hover {
      transform: scale(1.08);
      background: #f49ac1;
    }

    .no-results {
      text-align: center;
      color: #b07d93;
      font-size: 15px;
      display: none;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: #b07d93;
    }
  </style>
</head>
<body>

  <div class="floating-sparkle">˚⟡˖ ࣪</div>

  <div class="window">
    <div class="top-bar">
      <span>✿ tv shows</span>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <div class="content">
      <header>
        <h1>tv shows</h1>
      </header>

      <nav>
        <a href="index.html" class="nav-link">home</a>
        <a href="movies.html" class="nav-link">movies</a>
        <a href="shows.html" class="nav-link active">tv shows</a>
      </nav>

      <!-- Search Bar -->
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="search a tv show... ˚⟡˖ ࣪">
      </div>

      <!-- Posters automatically appear here -->
      <div class="poster-grid" id="grid"></div>
      <p class="no-results" id="noResults">no tv shows found matching that name ♡</p>

      <footer>
        made with ♡ and lots of pink pixels • 2026
      </footer>
    </div>
  </div>

  <!-- ========================================================= -->
  <!--       YOUR EASY TV SHOW LIST (EDIT ONLY THIS PART!)       -->
  <!-- ========================================================= -->
  <script>
    const myShows = [
      { title: "Nana", poster: "https://i.pinimg.com/1200x/9c/b6/a5/9cb6a53c3121c5471c515bff4dc78113.jpg", link: "https://archive.org/details/nana.-s-01-e-04_202508/NANA.S01E01.mkv" },
      { title: "TV Show Name 2", poster: "PASTE_POSTER_LINK_2", link: "PASTE_WATCH_LINK_2" },
      { title: "TV Show Name 3", poster: "PASTE_POSTER_LINK_3", link: "PASTE_WATCH_LINK_3" },
      // To add more, copy a line above and paste it right here!
    ];

    // Do not touch anything below this line!
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("searchInput");
    const noResults = document.getElementById("noResults");

    function renderCards(list) {
      grid.innerHTML = "";
      if (list.length === 0) {
        noResults.style.display = "block";
        return;
      }
      noResults.style.display = "none";
      list.forEach(item => {
        grid.innerHTML += `
          <div class="poster-card">
            <p class="movie-title">${item.title}</p>
            <img src="${item.poster}" alt="${item.title}">
            <a href="${item.link}" target="_blank" class="watch-btn">click to watch</a>
          </div>
        `;
      });
    }

    renderCards(myShows);

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase();
      const filtered = myShows.filter(s => s.title.toLowerCase().includes(query));
      renderCards(filtered);
    });
  </script>

</body>
</html>
